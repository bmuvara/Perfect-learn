<div class="container">
    
  
  
     <div>
         <table class="table">
             <thead>
             <tr>
                <th>Date</th>
                <th>Feed Type</th>
                <th>Quantity(kg)</th>
                <th>Unit Price</th>
                <th>Total Cost</th>
                <th>Comment</th>




             </tr>
            </thead>
            <tbody>
                <tr *ngFor="let feedcost of feedcosts">
              <td>{{feedcost.date}}</td>      
              <td>{{feedcost.feedtype}}</td>
              <td>{{feedcost.quantity}}</td> 
              <td>{{feedcost.unitprice}}</td>
              <td>{{feedcost.totalcost}}</td>
              <td>{{feedcost.comment}}</td>   
                       
                    <!-- <td>
                        <button type="button" class="btn btn-primary" [routerLink]="['/admin/addcourse']" (click)="requestCourse()">requestCourse</button>
                    </td> -->
                </tr>


            </tbody>


         </table>

     </div>

</div>
